<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Quick Events Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-6">Тест: Секция быстрого создания прогонов тестов</h1>
    
    <!-- Quick Test Event Creation Section -->
    <div class="mb-6">
        <div class="bg-gradient-to-r from-green-500 to-emerald-600 rounded-xl shadow-lg overflow-hidden">
            <div class="p-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div class="bg-white/20 backdrop-blur-sm rounded-lg p-3">
                            <i class="ri-play-circle-line text-3xl text-white"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-semibold text-white">Создать прогон тестов</h3>
                            <p class="text-green-100 text-sm mt-1">Организуйте командное тестирование с отслеживанием прогресса</p>
                        </div>
                    </div>
                    <button id="quick-test-event-btn" class="px-6 py-3 bg-white text-green-600 font-medium rounded-lg hover:bg-green-50 transition-all transform hover:scale-105 shadow-lg">
                        <i class="ri-add-circle-line mr-2"></i>
                        Создать прогон
                    </button>
                </div>
                
                <!-- Quick Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                    <div class="bg-white/10 backdrop-blur-sm rounded-lg p-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-green-100 text-sm">Активные прогоны</p>
                                <p id="active-test-runs-count" class="text-2xl font-bold text-white mt-1">3</p>
                            </div>
                            <i class="ri-pulse-line text-2xl text-green-200"></i>
                        </div>
                    </div>
                    <div class="bg-white/10 backdrop-blur-sm rounded-lg p-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-green-100 text-sm">Прогоны сегодня</p>
                                <p id="today-test-runs-count" class="text-2xl font-bold text-white mt-1">5</p>
                            </div>
                            <i class="ri-calendar-check-line text-2xl text-green-200"></i>
                        </div>
                    </div>
                    <div class="bg-white/10 backdrop-blur-sm rounded-lg p-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-green-100 text-sm">Участников онлайн</p>
                                <p id="active-participants-count" class="text-2xl font-bold text-white mt-1">12</p>
                            </div>
                            <i class="ri-team-line text-2xl text-green-200"></i>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Quick Actions Bar -->
            <div class="bg-black/10 backdrop-blur-sm px-6 py-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <button id="view-active-runs-btn" class="text-sm text-white/90 hover:text-white flex items-center space-x-1 transition-colors">
                            <i class="ri-eye-line"></i>
                            <span>Просмотр активных</span>
                        </button>
                        <span class="text-white/30">|</span>
                        <button id="test-templates-btn" class="text-sm text-white/90 hover:text-white flex items-center space-x-1 transition-colors">
                            <i class="ri-file-copy-line"></i>
                            <span>Шаблоны прогонов</span>
                        </button>
                        <span class="text-white/30">|</span>
                        <button id="test-history-btn" class="text-sm text-white/90 hover:text-white flex items-center space-x-1 transition-colors">
                            <i class="ri-history-line"></i>
                            <span>История тестирования</span>
                        </button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-green-200">Следующий запланированный:</span>
                        <span id="next-scheduled-run" class="text-sm font-medium text-white">Прогон регрессии - 15:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-8 bg-white rounded-lg p-6">
        <h2 class="text-lg font-semibold mb-4">Статус компонента:</h2>
        <div id="status" class="space-y-2">
            <p class="text-green-600">✓ HTML разметка загружена</p>
        </div>
    </div>
    
    <script>
        // Test button functionality
        document.getElementById('quick-test-event-btn').addEventListener('click', function() {
            alert('Кнопка "Создать прогон" работает!');
            document.getElementById('status').innerHTML += '<p class="text-green-600">✓ Обработчик кнопки работает</p>';
        });
        
        document.getElementById('view-active-runs-btn').addEventListener('click', function() {
            alert('Просмотр активных прогонов');
        });
        
        document.getElementById('test-templates-btn').addEventListener('click', function() {
            alert('Шаблоны прогонов');
        });
        
        document.getElementById('test-history-btn').addEventListener('click', function() {
            alert('История тестирования');
        });
        
        document.getElementById('status').innerHTML += '<p class="text-green-600">✓ JavaScript загружен и работает</p>';
    </script>
</body>
</html>
