<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1f2e">
    <title>FlowTest - Register</title>
    <!-- StylesheetFix - load early to prevent CORS issues with external stylesheets -->
    <script src="js/stylesheet-fix-loader.js"></script>
    
    <link rel="stylesheet" href="css/tailwind-base.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.6.6/css/flag-icons.min.css"/>
    <script type="module" src="js/utils/theme.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center">
    <!-- Theme and Language Controls -->
    <div class="absolute top-4 right-4 flex space-x-4">
        <div class="relative">
            <select id="theme-select" class="appearance-none bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg pl-10 pr-8 py-2 focus:ring-2 focus:ring-coral-500 focus:border-transparent">
                <option value="light" data-i18n="light">Light</option>
                <option value="dark" data-i18n="dark">Dark</option>
                <option value="system" data-i18n="system">System</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                <span id="selected-theme-icon">
                    <i class="ri-sun-line dark:hidden"></i>
                    <i class="ri-moon-line hidden dark:inline"></i>
                </span>
            </div>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
                <i class="ri-arrow-down-s-line text-gray-400"></i>
            </div>
        </div>
        <div class="relative">
            <select id="language-select" class="appearance-none bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg pl-10 pr-8 py-2 focus:ring-2 focus:ring-coral-500 focus:border-transparent">
                <option value="en" class="flex items-center"><span class="fi fi-gb mr-2"></span>English</option>
                <option value="ru" class="flex items-center"><span class="fi fi-ru mr-2"></span>Русский</option>
                <option value="de" class="flex items-center"><span class="fi fi-de mr-2"></span>Deutsch</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                <span id="selected-language-flag" class="fi fi-gb"></span>
            </div>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
                <i class="ri-arrow-down-s-line text-gray-400"></i>
            </div>
        </div>
    </div>

    <div class="max-w-md w-full mx-4 p-8 bg-white dark:bg-gray-800 rounded-lg shadow-lg">
        <div class="flex justify-center mb-6">
            <img src="images/logo.svg" alt="FlowTest Logo" class="h-16">
        </div>
        
        <h1 class="text-2xl font-bold text-center mb-2" data-i18n="createAccount">Create an Account</h1>
        <p class="mt-2 text-sm text-center text-gray-600 dark:text-gray-400 mb-6" data-i18n="registerMsg">Sign up to start managing your tests</p>
        
        <div id="register-error" class="hidden mb-4 p-4 bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-200 rounded"></div>
        
        <form id="register-form" class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="first-name" class="block text-sm font-medium mb-1" data-i18n="firstName">First Name</label>
                    <input type="text" id="first-name" name="first_name" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-coral-500 bg-white dark:bg-gray-700"
                        data-i18n-placeholder="firstNamePlaceholder">
                </div>
                <div>
                    <label for="last-name" class="block text-sm font-medium mb-1" data-i18n="lastName">Last Name</label>
                    <input type="text" id="last-name" name="last_name" required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-coral-500 bg-white dark:bg-gray-700"
                        data-i18n-placeholder="lastNamePlaceholder">
                </div>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium mb-1" data-i18n="emailAddress">Email Address</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-coral-500 bg-white dark:bg-gray-700"
                    data-i18n-placeholder="emailPlaceholder">
            </div>
            
            <div>
                <label for="username" class="block text-sm font-medium mb-1" data-i18n="username">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-coral-500 bg-white dark:bg-gray-700"
                    data-i18n-placeholder="usernamePlaceholder">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium mb-1" data-i18n="password">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-coral-500 bg-white dark:bg-gray-700"
                    data-i18n-placeholder="passwordPlaceholder">
                <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">
                    <ul class="list-disc pl-5">
                        <li data-i18n="passwordReq1">At least 8 characters</li>
                        <li data-i18n="passwordReq2">At least one uppercase letter</li>
                        <li data-i18n="passwordReq3">At least one lowercase letter</li>
                        <li data-i18n="passwordReq4">At least one number</li>
                    </ul>
                </div>
            </div>
            
            <div>
                <label for="password-confirm" class="block text-sm font-medium mb-1" data-i18n="confirmPassword">Confirm Password</label>
                <input type="password" id="password-confirm" name="password_confirm" required
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-coral-500 bg-white dark:bg-gray-700"
                    data-i18n-placeholder="confirmPasswordPlaceholder">
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" id="terms" name="terms" required
                    class="h-4 w-4 text-coral-600 focus:ring-coral-500 border-gray-300 rounded">
                <label for="terms" class="ml-2 block text-sm">
                    <span data-i18n="acceptTerms">I accept the</span>
                    <a href="#" class="text-coral-600 hover:text-coral-500 dark:text-coral-400 dark:hover:text-coral-300" data-i18n="termsOfService">Terms of Service</a>
                    <span data-i18n="andPrivacy">and</span>
                    <a href="#" class="text-coral-600 hover:text-coral-500 dark:text-coral-400 dark:hover:text-coral-300" data-i18n="privacyPolicy">Privacy Policy</a>
                </label>
            </div>
            
            <div>
                <button type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-coral-500 hover:bg-coral-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-coral-500"
                    data-i18n="createAccountBtn">Create Account</button>
            </div>
        </form>
        
        <div class="mt-6 text-center text-sm">
            <span data-i18n="alreadyAccount">Already have an account?</span>
            <a href="login.html" class="text-coral-600 hover:text-coral-500 dark:text-coral-400 dark:hover:text-coral-300" data-i18n="signin-btn">Sign in</a>
        </div>
        
        <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
            <p>FlowTest 2.0 &copy; 2025</p>
        </div>
    </div>

    <script type="module" src="js/utils/toast.js"></script>
    <script type="module" src="js/i18n/translations.js"></script>
    <script type="module" src="js/i18n/i18n.js"></script>
    <script type="module" src="js/pages/register.js"></script>
</body>
</html>
