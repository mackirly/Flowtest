<!DOCTYPE html>
<html>
<head>
    <title>Avatar Upload Test</title>
    <link rel="stylesheet" href="js/lib/cropper.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #debug-log {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            max-height: 300px;
            overflow: auto;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex !important;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 90%;
            max-height: 90%;
        }
        .cropper-container {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <h1>Avatar Upload Test</h1>
    
    <!-- Avatar Upload Button -->
    <div>
        <label for="avatar-upload" style="cursor: pointer; padding: 10px; background: #007bff; color: white; border-radius: 4px;">
            Choose Avatar
            <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
        </label>
    </div>

    <!-- Avatar Preview -->
    <div style="margin-top: 20px;">
        <div style="width: 128px; height: 128px; border: 2px solid #ddd; border-radius: 50%; overflow: hidden;">
            <span id="user-avatar-text" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: #ff7f50; color: white; font-size: 48px;">A</span>
            <img id="user-avatar-image" src="" alt="User avatar" style="display: none; width: 100%; height: 100%; object-fit: cover;">
        </div>
    </div>

    <!-- Debug Log -->
    <div id="debug-log"></div>

    <!-- Crop Modal -->
    <div id="avatar-crop-modal" class="modal">
        <div class="modal-content">
            <h2>Crop Avatar</h2>
            <div style="max-width: 500px; margin: 20px auto;">
                <img id="avatar-to-crop" src="" alt="Image to crop" style="max-width: 100%;">
            </div>
            <div style="text-align: right; margin-top: 10px;">
                <button id="cancel-avatar-crop-button">Cancel</button>
                <button id="save-avatar-crop-button" style="margin-left: 10px;">Save</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/lib/cropper.min.js"></script>
    <script type="module">
        import avatarCropper from './js/utils/avatar-cropper-simple.js';
        
        // Debug logger
        const debugLog = document.getElementById('debug-log');
        function log(message, data = '') {
            const entry = document.createElement('div');
            entry.textContent = `${new Date().toISOString().split('T')[1]} - ${message} ${JSON.stringify(data)}`;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message, data);
        }

        // Listen for debug events
        document.addEventListener('avatar-debug', (e) => {
            log('Debug Event:', e.detail);
        });

        // Initialize avatar upload
        document.addEventListener('DOMContentLoaded', () => {
            log('Page loaded');
            log('Cropper available:', typeof Cropper !== 'undefined');
            
            const avatarText = document.getElementById('user-avatar-text');
            const avatarImage = document.getElementById('user-avatar-image');

            // Set up avatar save callback
            avatarCropper.setSaveCallback((file, dataUrl) => {
                log('Avatar saved:', { fileName: file.name, size: file.size });
                avatarText.style.display = 'none';
                avatarImage.style.display = 'block';
                avatarImage.src = dataUrl;
            });
        });
    </script>
</body>
</html>
