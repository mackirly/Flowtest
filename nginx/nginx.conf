worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Add proper MIME types for JavaScript modules
    types {
        application/javascript js;
        application/javascript mjs;
    }

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # Backend server
    upstream backend_server {
        server flowtest-backend:8000;
    }

    # Frontend server
    upstream frontend_server {
        server flowtest-frontend:80;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Frontend - serve static files
        location / {
            root /app/static;
            index index.html;
            try_files $uri $uri/ @rewrites;

            # Basic headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval'; object-src 'none'" always;
            
            # Cache control for static assets
            location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # Handle page routing
        location @rewrites {
            rewrite ^(.+)$ /index.html last;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # WebSockets
        location /ws/ {
            proxy_pass http://backend_server/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Admin panel
        location /admin/ {
            proxy_pass http://backend_server/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files 
        location /static/ {
            alias /app/static/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            access_log off;
            expires 30d;
            try_files $uri $uri/ =404;
            
            # Allow cross-origin
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        }

        # Error handling
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
