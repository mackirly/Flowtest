version: '3.8'

services:
  # Backend (Django)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.fix
    container_name: flowtest-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - automation_repos:/app/automation_projects
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SECRET_KEY=dev_secret_key_will_be_changed_in_production
      - DJANGO_DEBUG=True
      - POSTGRES_DB=flowtest
      - POSTGRES_USER=flowtestuser
      - POSTGRES_PASSWORD=flowtestpass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Celery Worker
  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile.fix
    container_name: flowtest-celery-worker
    entrypoint: docker-entrypoint.sh
    command: celery -A flowtest worker --loglevel=info
    volumes:
      - ./backend:/app
      - automation_repos:/app/automation_projects
    depends_on:
      - backend
      - redis
      - db
    environment:
      - DJANGO_SECRET_KEY=dev_secret_key_will_be_changed_in_production
      - DJANGO_DEBUG=True
      - POSTGRES_DB=flowtest
      - POSTGRES_USER=flowtestuser
      - POSTGRES_PASSWORD=flowtestpass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # Celery Beat for scheduled tasks
  celery_beat:
    build: 
      context: ./backend
      dockerfile: Dockerfile.fix
    container_name: flowtest-celery-beat
    entrypoint: docker-entrypoint.sh
    command: celery -A flowtest beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - db
    environment:
      - DJANGO_SECRET_KEY=dev_secret_key_will_be_changed_in_production
      - DJANGO_DEBUG=True
      - POSTGRES_DB=flowtest
      - POSTGRES_USER=flowtestuser
      - POSTGRES_PASSWORD=flowtestpass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: flowtest-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=flowtest
      - POSTGRES_USER=flowtestuser
      - POSTGRES_PASSWORD=flowtestpass
    ports:
      - "5432:5432"

  # Redis
  redis:
    image: redis:alpine
    container_name: flowtest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Frontend with Nginx
  frontend:
    image: nginx:alpine
    container_name: flowtest-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    command: [nginx-debug, '-g', 'daemon off;']
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Proxy
  nginx:
    image: nginx:alpine
    container_name: flowtest-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/media:/app/media:ro
      - ./backend/static:/app/static:ro
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    command: [nginx-debug, '-g', 'daemon off;']

volumes:
  postgres_data:
  redis_data:
  automation_repos: